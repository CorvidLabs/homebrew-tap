name: Formulae

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # main, 2026-07-10
      - name: Style formulae
        run: brew style Formula/fledge.rb Formula/spec-sync.rb Formula/augur.rb Formula/attest.rb
      - name: Install pinned Trust components
        run: >-
          brew install --formula
          ./Formula/fledge.rb
          ./Formula/spec-sync.rb
          ./Formula/augur.rb
          ./Formula/attest.rb
      - name: Verify installed commands
        run: |
          fledge --version
          specsync --version
          augur --version
          attest --version
      - name: Run formula tests
        run: |
          brew test fledge
          brew test spec-sync
          brew test augur
          brew test attest
