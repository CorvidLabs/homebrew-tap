name: Formulae

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Run the ubuntu-latest leg on ubuntu-24.04 while ubuntu-latest rolls over to 26.04:
    # 26.04 ships libxml2 under the new SONAME libxml2.so.16, and the prebuilt augur
    # binary still needs libxml2.so.2. matrix.os stays ubuntu-latest, so the job keeps
    # the required check name "Install (ubuntu-latest)". Revert to
    # `runs-on: ${{ matrix.os }}` once CorvidLabs/augur#59 ships a fixed binary.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # main, 2026-07-10
      - name: Verify tap uses checked-out pull request
        run: test "$(realpath "$(brew --repository corvidlabs/tap)")" = "$(realpath "$GITHUB_WORKSPACE")"
      - name: Style formulae
        run: brew style Formula/*.rb
      - name: Install pinned formulae
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: >-
          brew install
          corvidlabs/tap/fledge
          corvidlabs/tap/spec-sync
          corvidlabs/tap/augur
          corvidlabs/tap/attest
          corvidlabs/tap/corvid-trust
          corvidlabs/tap/rune
          corvidlabs/tap/hi
      - name: Verify installed commands
        run: |
          fledge --version
          specsync --version
          augur --version
          attest --version
          fledge trust --version
          rune version --json
          hi --version
      - name: Run formula tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew test corvidlabs/tap/fledge
          brew test corvidlabs/tap/spec-sync
          brew test corvidlabs/tap/augur
          brew test corvidlabs/tap/attest
          brew test corvidlabs/tap/corvid-trust
          brew test corvidlabs/tap/rune
          brew test corvidlabs/tap/hi
