name: Bump Rune

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-rune
  cancel-in-progress: false

jobs:
  bump:
    name: Check latest Rune release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # main, 2026-07-10

      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/CorvidLabs/rune/releases/latest --jq .tag_name)"
          version="${tag#v}"
          current="$(brew info --json=v2 corvidlabs/tap/rune | jq -r '.formulae[0].versions.stable')"
          existing="$(gh pr list --state open --search "rune ${version} in:title" --json number --jq length)"

          {
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$version" == "$current" || "$existing" != "0" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url="https://github.com/CorvidLabs/rune/archive/refs/tags/${tag}.tar.gz"
          curl --fail --location --silent --show-error --output rune.tar.gz "$url"
          sha256="$(sha256sum rune.tar.gz | cut -d ' ' -f 1)"

          {
            echo "sha256=${sha256}"
            echo "update=true"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"

      - name: Open formula bump pull request
        if: steps.release.outputs.update == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: >-
          brew bump-formula-pr
          --no-browse
          --no-fork
          --strict
          --online
          --version "${{ steps.release.outputs.version }}"
          --url "${{ steps.release.outputs.url }}"
          --sha256 "${{ steps.release.outputs.sha256 }}"
          corvidlabs/tap/rune
